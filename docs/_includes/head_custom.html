<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  document.addEventListener('DOMContentLoaded', async () => {
    // just-the-docs / kramdown renders ```mermaid as <div class="language-mermaid highlighter-rouge"><div class="highlight"><pre class="highlight"><code>...
    // or <pre><code class="language-mermaid">...
    const blocks = document.querySelectorAll('code.language-mermaid, pre.language-mermaid, div.language-mermaid pre');
    if (!blocks.length) return;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
    });

    const targets = [];
    blocks.forEach((el) => {
      // Find the outermost container to replace
      const container = el.closest('.language-mermaid') || el.closest('pre') || el;
      if (targets.includes(container)) return;
      targets.push(container);
    });

    for (let i = 0; i < targets.length; i++) {
      const container = targets[i];
      const code = container.textContent.trim();
      const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
      try {
        const { svg } = await mermaid.render(id, code);
        const div = document.createElement('div');
        div.className = 'mermaid-rendered';
        div.style.cssText = 'display:flex; justify-content:center; margin:1.5rem 0; overflow-x:auto;';
        div.innerHTML = svg;
        container.replaceWith(div);
      } catch (err) {
        console.error('Mermaid render error:', err);
      }
    }
  });
</script>
