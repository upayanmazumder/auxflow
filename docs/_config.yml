title: AuxFlow
description: Static convergence classification for multi-pass document compilation.
theme: just-the-docs

url: "https://auxflow.upayan.dev"

aux_links:
  "PyPI ↗":
    - "https://pypi.org/project/auxflow/"
  "GitHub ↗":
    - "https://github.com/upayanmazumder/auxflow"
aux_links_new_tab: true

search_enabled: true
heading_anchors: true
color_scheme: dark
back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  MIT License &nbsp;·&nbsp;
  <a href="https://pypi.org/project/auxflow/"><code>pip install auxflow</code></a>

# figures/ and screenshots/ are paper assets, not site content
exclude:
  - Gemfile
  - Gemfile.lock
  - figures/
  - screenshots/
