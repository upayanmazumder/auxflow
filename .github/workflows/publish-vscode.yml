name: Publish VS Code extension

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    name: bump version, test, and package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG#vscode-}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected vX.Y.Z or vscode-vX.Y.Z, got $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Require matching Python package release
        if: ${{ startsWith(github.event.release.tag_name, 'vscode-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "v${RELEASE_VERSION}" --json tagName --jq '.tagName'
      - name: Bump extension version
        working-directory: extension
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - name: Install dependencies
        working-directory: extension
        run: npm ci
      - name: Check extension formatting
        working-directory: extension
        run: npm run format:check
      - name: Test extension
        working-directory: extension
        run: xvfb-run -a npm test
      - name: Package extension
        working-directory: extension
        run: |
          npm run package
          test -f "auxflow-${RELEASE_VERSION}.vsix"
      - name: Store VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: extension/auxflow-*.vsix
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    name: attach VSIX to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: dist/
      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#vscode-}"
          vsix="dist/auxflow-${version#v}.vsix"
          test -f "$vsix"
          gh release upload "$GITHUB_REF_NAME" "$vsix"

  sync-version:
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    name: save tested extension version to main
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update version after successful tests
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG#vscode-}"
          version="${tag#v}"
          RELEASE_VERSION="$version" node -e "if (require('./extension/package.json').version.localeCompare(process.env.RELEASE_VERSION, undefined, {numeric: true}) > 0) throw new Error('Refusing to lower the extension version on main')"
          npm version "$version" --prefix extension --no-git-tag-version --allow-same-version
          git add extension/package.json extension/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync VS Code extension version to $version"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
