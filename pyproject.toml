[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "auxflow"
dynamic = ["version"]
description = "Static convergence classification for multi-pass document compilation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Upayan Mazumder" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
# Deliberately dependency-free at the core. The analysis must not depend on a
# third-party graph library: implementing Tarjan and the dataflow fixpoint by
# hand is part of the project.
dependencies = []

[project.urls]
Homepage = "https://auxflow.upayan.dev"
Documentation = "https://auxflow.upayan.dev"
Repository = "https://github.com/upayanmazumder/auxflow"
Issues = "https://github.com/upayanmazumder/auxflow/issues"
Changelog = "https://auxflow.upayan.dev/changelog.html"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "pydot>=3"]
bench = ["matplotlib>=3.9", "pyyaml>=6"]

[project.scripts]
auxflow = "auxflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auxflow"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/auxflow/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "engine: requires a TeX engine to be installed",
  "slow: excluded from the default run",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/auxflow"]
