# AuxFlow implementation plan — machine-readable GitHub rollout.
#
# Source of truth for the GitHub poster: creates one project, seven checkpoint
# milestones (CP1-CP6 + Evaluation, with Gate 1 and Gate 2 surfaced), sixteen
# phase issues, and detailed sub-issues sized for parallel implementation
# subagents. Scored by bench/plan/validate_plan.py against docs/IMPLEMENTATION-
# PLAN.md and docs/SCOPE.md.
#
# Schedule compressed to a 5-day solo build. Per-phase hours, dependencies, and
# risk are the authoritative effort facts and are unchanged by the calendar.
# Generated by assembling five doc-grounded fragments; edit via regeneration.

schedule_days: 5
project:
  name: AuxFlow Implementation
  description: 5-day solo build of the AuxFlow static convergence compiler. One issue per implementation
    phase, sub-issues sized for parallel subagents.
  fields:
  - Status
  - Phase
  - Risk
  - Estimate
  views:
  - Board
  - Roadmap
  - Table
milestones:
- key: cp1
  title: CP1 — Lexer (Day 1)
  description: 'Day 1. Tooling, the planner safety assertion written first, and the category-code lexer.
    Checkpoint: lexer passes unit tests incl. verbatim, comments, nested braces; the round-trip property
    holds.'
  phases:
  - 1
  - 2
- key: cp2
  title: CP2 — Front end parses corpus (Day 2 morning)
  description: 'Day 2. Recursive-descent parser and the AST with inclusion resolution. Checkpoint: the
    front end parses every corpus document and inclusion cycles are detected.'
  phases:
  - 3
  - 4
- key: cp3
  title: CP3 — Symbol tables and check (Day 2)
  description: 'Day 2. Six symbol tables and semantic diagnostics. Checkpoint: auxflow check finds seeded
    undefined references, duplicate labels, and missing files with zero engine runs.'
  phases:
  - 5
  - 6
- key: cp4
  title: CP4 — Classifier headline result; Gate 1 (Day 3)
  description: 'Day 3. ARG, iterative Tarjan SCC, and content-quantity taint. Checkpoint: b08 classified
    amplifying with three named facts; b05 not amplifying. Gate 1: if the classifier cannot separate b08
    from b05 the project reframes around the front end, the mechanism taxonomy, and the oracle comparison.'
  phases:
  - 7
  - 8
  - 9
- key: cp5
  title: CP5 — Fixpoint and classifier complete (Day 4 morning)
  description: 'Day 4. Stable-pass numbering on the condensation and the four-state classifier. Checkpoint:
    diagnostics match the specified NON-CONVERGENCE.md formats; derived run count produced.'
  phases:
  - 10
  - 11
- key: cp6
  title: CP6 — MVP complete (Day 4)
  description: 'Day 4. Build planner with the safety invariant and runtime verification. Checkpoint: end-to-end
    auxflow run on all fifteen documents with zero undeclared under-predictions.'
  phases:
  - 12
  - 13
- key: eval
  title: Evaluation and report; Gate 2 (Day 5)
  description: 'Day 5. Benchmark harness, full measurement, and the report. Gate 2: empirical claim EC1
    — predicted run count is at least ground truth for every certified document; on failure apply the
    D7 conservative fallback and report the failing document as a case study.'
  phases:
  - 14
  - 15
  - 16
issues:
- phase: 1
  title: Phase 1 — Project and tooling setup
  hours: 6
  risk: LOW
  depends_on: []
  milestone: cp1
  labels:
  - phase
  - infra
  body: 'Stand up the repository skeleton, CI (lint, type-check, tests), and an importable but empty `auxflow`
    package. Per the implementation-plan ordering rationale the planner safety assertion is written FIRST,
    before any lexer or parser code, so the invariant "AuxFlow never emits a plan shorter than the conservative
    default for an uncertified document" is enforced from day one. Acceptance: CI green on an empty package
    and the safety property test present and passing.'
  sub_issues:
  - title: Scaffold the auxflow package and CLI entry point
    body: Create `src/auxflow/__init__.py` and a `auxflow` console entry point via pyproject.toml. `python
      -c "import auxflow"` must succeed and `auxflow --help` must list subcommand stubs. No business logic
      yet; package imports cleanly.
    labels:
    - task
    - infra
  - title: 'Configure CI: lint, type-check, tests'
    body: 'Add CI running ruff (lint), mypy (type-check), and pytest. Pipeline must pass on the empty
      package. Acceptance: a green CI run on the initial commit with all three stages invoked and non-skipped.'
    labels:
    - task
    - infra
  - title: Write the planner safety assertion property test FIRST
    body: Before any parser code, add a property test (hypothesis) over randomly generated classifications
      asserting AuxFlow never emits a plan shorter than the conservative default for a non-certified document
      (LANGUAGE-SUBSET fallback rule 4). Test lives in tests/test_safety_invariant.py and passes against
      a stub conservative-default.
    labels:
    - task
    - safety
- phase: 2
  title: Phase 2 — Lexer
  hours: 14
  risk: LOW
  depends_on:
  - 1
  milestone: cp1
  labels:
  - phase
  - lexer
  body: 'Implement the category-code tokenizer: a 256-entry category table classifying every character
    by TeX catcode (codes 0-15), grouping characters into `Token(catcode, text, file_id, line, col, offset)`.
    Control sequences are escape (catcode 0) plus a maximal letter run (catcode 11) or one other character.
    Comments (`%` but not `\%`) and verbatim (`\verb`, `verbatim`) must be recognised so later phases
    never see their contents as syntax. Exposes `auxflow tokens`. Acceptance: a round-trip property test
    and verbatim/comment handling pass.'
  sub_issues:
  - title: Category-code table and single-pass table-driven scan
    body: 'Build the 256-entry category table (codes 0-15) and the single-pass scanner emitting `Token(catcode,
      text, file_id, line, col, offset)`. Control-sequence rule: escape char then maximal letter run or
      exactly one other char. Acceptance: unit tests cover each catcode class and both control-sequence
      shapes.'
    labels:
    - task
    - lexer
  - title: Comment and verbatim handling
    body: '`%` starts a comment and consumes the following newline plus leading whitespace on the next
      line; `\%` does not. `\verb|...|` takes its delimiter from the next character; `verbatim` env body
      is skipped. Acceptance: tests assert comment and verbatim spans are tokenised as opaque regions,
      never as syntax.'
    labels:
    - task
    - lexer
  - title: auxflow tokens CLI and round-trip property test
    body: 'Wire `auxflow tokens <file>` to print the token stream. Add a round-trip property test: concatenating
      token `text` in order reproduces the original source bytes exactly for arbitrary inputs. Acceptance:
      `auxflow tokens` runs and the round-trip property test passes.'
    labels:
    - task
    - lexer
- phase: 3
  title: Phase 3 — Parser
  hours: 22
  risk: HIGH
  depends_on:
  - 2
  milestone: cp2
  labels:
  - phase
  - parser
  body: 'Implement the hand-written recursive-descent parser with one token of lookahead, consuming the
    lexer token stream and producing one AST per file. Argument parsing is driven by an argument-signature
    table of known macro signatures (`\label{}` one mandatory; `\includegraphics[]{}` one optional and
    one mandatory); unknown control sequences consume no arguments and yield a bare `MacroCall`. This
    is the highest-risk phase: optional arguments, nested braces inside optional arguments, and verbatim
    interaction are where time goes. Recovery on malformed input is required. Acceptance: parser produces
    ASTs for corpus inputs and recovers from malformed input without crashing.'
  sub_issues:
  - title: Recursive-descent core with one-token lookahead
    body: 'Implement the predictive recursive-descent parser recovering document structure: preamble,
      environments, groups, sectioning, macro calls. One token of lookahead. Acceptance: tests parse nested
      groups and environments into the phase-3 node classes with correct nesting.'
    labels:
    - task
    - parser
  - title: Argument-signature table and optional-argument handling
    body: 'Build the argument-signature table of known macro signatures (`\label{}` one mandatory, `\includegraphics[]{}`
      one optional + one mandatory). Handle optional `[...]` arguments including nested braces inside
      them, and unknown control sequences producing a bare `MacroCall` with no arguments. Acceptance:
      tests cover mandatory-only, optional+mandatory, nested-brace optional, and unknown-macro cases.'
    labels:
    - task
    - parser
  - title: Error recovery on malformed input
    body: 'Add recovery so malformed input (unbalanced braces, unterminated environments) produces a partial
      AST plus diagnostics rather than a crash. Acceptance: tests feed malformed fixtures and assert the
      parser returns a tree and reports the error span without raising.'
    labels:
    - task
    - parser
- phase: 4
  title: Phase 4 — AST and inclusion resolution
  hours: 12
  risk: MED
  depends_on:
  - 3
  milestone: cp2
  labels:
  - phase
  - ast
  body: 'Build the typed AST layer over parser events in src/auxflow/ast/. Define the node kinds (Document,
    Preamble, DocumentClass, UsePackage, Include(kind), Sectioning(level), Environment(name), MacroCall(name,
    args), Group, Text, Comment, VerbatimBlock, MacroDef(name, arity, body_tokens), CounterOp, ControlConstruct,
    Opaque) with a mandatory Span(file_id, start, end) on every node. Assemble per-file ASTs into a multi-file
    forest and build the inclusion graph from \input/\include edges with DFS cycle detection. MacroDef
    bodies stay unexpanded tokens; modelled constructs inside a body mark it opaque. Acceptance: `auxflow
    ast FILE` pretty-prints the forest; every node carries a non-null span; inclusion cycles are detected
    and reported.'
  sub_issues:
  - title: Define AST node classes with mandatory Span in ast/nodes.py
    body: 'Implement all node kinds listed in COMPILER-PIPELINE.md section 3 in src/auxflow/ast/nodes.py.
      Each node constructor must require a Span(file_id, start, end); construction without a span raises.
      MacroDef stores body_tokens unexpanded and an opaque flag. Acceptance: instantiating every node
      kind sets a non-null span; a unit test asserts span presence on each class.'
    labels:
    - task
    - ast
  - title: Implement visitor traversal and pretty printer in ast/visitor.py and ast/printer.py
    body: 'Add a visitor-pattern traversal (ast/visitor.py) and a deterministic pretty printer (ast/printer.py)
      that renders the node tree with indentation and spans. Acceptance: the printer output is stable
      across runs and covers every node kind; a golden-style test compares printed output for a fixture
      document.'
    labels:
    - task
    - ast
  - title: Build multi-file forest and inclusion graph with cycle detection in ast/inclusion wiring
    body: 'Assemble per-file ASTs into a forest keyed by file_id and construct the inclusion graph from
      \input and \include nodes. Implement DFS colouring to detect inclusion cycles and record each file''s
      includer and reachability. Acceptance: a two-file include chain links correctly; a self-including
      or mutually-including fixture is flagged as a cycle with the participating file ids.'
    labels:
    - task
    - ast
  - title: Wire the `auxflow ast` CLI subcommand
    body: 'Add the `auxflow ast FILE` subcommand to the CLI entry point so it parses the file, builds
      the forest, and prints the pretty-printed AST forest (layer 1, no engine). Acceptance: `auxflow
      ast fixture.tex` exits zero and emits the printed forest; a CLI test asserts expected node lines
      appear in output.'
    labels:
    - task
    - ast
- phase: 5
  title: Phase 5 — Symbol tables
  hours: 12
  risk: LOW
  depends_on:
  - 4
  milestone: cp3
  labels:
  - phase
  - symbol-table
  body: 'Construct the six symbol tables over the AST forest in src/auxflow/semantic/tables.py and resolve.py:
    LabelTable, RefTable, CiteTable, PackageTable, FileTable, CounterTable with the keys and values specified
    in COMPILER-PIPELINE.md section 4. Use a two-phase traversal — declare, then resolve — so forward
    references across file boundaries are not misreported as undefined. Name resolution is multi-file:
    a label defined in one included file and referenced in another resolves as cross-module name resolution.
    Acceptance: `auxflow symbols FILE` dumps all six tables; a forward reference resolves correctly; duplicate
    labels set the duplicate flag.'
  sub_issues:
  - title: Define the six symbol table data structures in semantic/tables.py
    body: 'Implement LabelTable (label key -> defining node, counter kind, file, span, duplicate flag),
      RefTable (label key -> uses with kind ref/pageref and span), CiteTable (cite key -> bibliography
      presence, spans), PackageTable (package -> fact kinds, tool, modelled flag), FileTable (file id
      -> path, includer, reachability, opacity), CounterTable (counter -> definitions, reads, writes,
      spans). Acceptance: each table exposes typed insert and lookup; a unit test populates and reads
      every table.'
    labels:
    - task
    - symbol-table
  - title: Implement the declare phase traversal in semantic/resolve.py
    body: 'First-pass traversal of the forest that records all definitions: \label targets into LabelTable
      (setting the duplicate flag on repeats), \usepackage into PackageTable, files into FileTable, counter
      ops into CounterTable. No resolution occurs yet. Acceptance: a document with a label defined after
      its \ref still registers the label definition; duplicate labels are marked.'
    labels:
    - task
    - symbol-table
  - title: Implement the resolve phase binding references across files
    body: 'Second pass that binds \ref/\pageref uses to LabelTable entries and \cite uses to CiteTable
      entries across all files in the forest, populating RefTable and resolving cross-file names. Acceptance:
      a label defined in an included file and referenced in the parent resolves; a forward reference within
      one file resolves; unresolved uses remain flagged for phase 6.'
    labels:
    - task
    - symbol-table
  - title: Wire the `auxflow symbols` CLI subcommand
    body: 'Add `auxflow symbols FILE` that runs both phases and dumps all six tables in a deterministic,
      readable form (layer 1, no engine). Acceptance: `auxflow symbols fixture.tex` exits zero and prints
      each table with its entries; a CLI test asserts a known label and cite key appear in the dump.'
    labels:
    - task
    - symbol-table
- phase: 6
  title: Phase 6 — Semantic analysis
  hours: 10
  risk: LOW
  depends_on:
  - 5
  milestone: cp3
  labels:
  - phase
  - semantic
  body: 'Run the semantic checks over the AST forest and resolved symbol tables in src/auxflow/semantic/diagnostics.py
    and inclusion.py, emitting a structured Diagnostic with a Span for each defect. Checks: undefined
    reference, undefined citation, duplicate label, unresolvable inclusion, missing graphics file, inclusion
    cycle, and use of an unmodelled package. Resolution is by table lookup after phase 5; inclusion cycles
    use DFS colouring. Every check runs with zero engine executions — these are defects an engine would
    surface only after a full typesetting run, if at all. Acceptance: `auxflow check FILE` prints spanned
    diagnostics and exits non-zero on error.'
  sub_issues:
  - title: Implement reference, citation, and duplicate-label checks in semantic/diagnostics.py
    body: 'Produce a Diagnostic (structured record with a Span) for each \ref/\pageref with no LabelTable
      entry (undefined reference), each \cite absent from CiteTable (undefined citation), and each LabelTable
      entry whose duplicate flag is set (duplicate label). Acceptance: a fixture with one undefined ref,
      one undefined cite, and one duplicate label yields exactly three diagnostics, each carrying the
      correct file_id and span.'
    labels:
    - task
    - semantic
  - title: 'Implement inclusion checks: unresolvable inclusion, missing graphics, inclusion cycle'
    body: 'In semantic/inclusion.py, emit a spanned Diagnostic for each \input/\include whose target file
      does not exist (unresolvable inclusion), each \includegraphics whose file is absent (missing graphics),
      and each inclusion cycle found via DFS colouring. Only stat calls are permitted for existence; no
      subprocess. Acceptance: fixtures for a missing include, a missing image, and a two-file include
      cycle each produce the corresponding diagnostic with a span.'
    labels:
    - task
    - semantic
  - title: Implement unmodelled-package warning via PackageTable
    body: 'Emit a Diagnostic when a \usepackage names a package whose PackageTable entry marks it not
      modelled, so downstream opacity is traceable. Acceptance: a document using an unmodelled package
      yields one diagnostic with the \usepackage span; a modelled package yields none.'
    labels:
    - task
    - semantic
  - title: Wire `auxflow check` with zero engine executions and non-zero exit on error
    body: 'Add `auxflow check FILE` that runs all semantic checks, prints every Diagnostic with its span,
      and exits non-zero when any error-level diagnostic is present. The command must invoke no TeX engine
      and spawn no subprocess. Acceptance: a clean fixture exits zero with no diagnostics; a fixture with
      an undefined reference exits non-zero and prints the spanned diagnostic.'
    labels:
    - task
    - semantic
- phase: 7
  title: Phase 7 — IR generation
  hours: 14
  risk: MED
  depends_on:
  - 6
  milestone: cp4
  labels:
  - phase
  - ir
  body: 'Lower the AST and symbol tables into the Auxiliary Reference Graph (ARG) per the syntax-directed
    rules in docs/IR.md and docs/STATIC-ANALYSIS.md section 1. Nodes are individual auxiliary fact instances
    (not fact kinds) carrying mandatory spans; edges carry a pass_lag and a dependency_type. Implement
    the exists/value split so list-producing facts split into an exists node (structure-determined, feeds
    CONTENT_VOLUME) and a value node (page/counter), keeping ordinary documents acyclic. One traversal,
    one rule per modelled construct, O(n+V+E). The ARG must be analysable in its own terms: analysis/
    may not import ast/. Serialise to JSON for tests and to Graphviz DOT via `auxflow graph`, colouring
    nodes by component and edges by dependency type. Acceptance: `auxflow graph` emits valid DOT for the
    three worked examples in docs/IR.md with the stable_pass-implying edge structure.'
  sub_issues:
  - title: Define Fact, FactKind, DepType, DepEdge data model
    body: 'Implement FactKind enum (LABEL_NUMBER, LABEL_PAGE, REF_USE, PAGEREF_USE, TOC_ENTRY, LOF_ENTRY,
      LOT_ENTRY, LIST_EXTENT, CITE_USE, BBL, COUNTER_READ, CONTENT_VOLUME, OPAQUE, and optional INDEX_ENTRY/IND),
      the Component Literal "exists"|"value", frozen Fact dataclass with mandatory source_location Span,
      and DepType (AUX_ROUNDTRIP, TOOL, LAYOUT, STRUCTURAL) plus frozen DepEdge with pass_lag and verbatim
      reason. Acceptance: every Fact rejects construction without a Span; unit test asserts source_location
      required.'
    labels:
    - task
    - ir
  - title: Syntax-directed lowering rules for the auxiliary reference graph
    body: 'Implement one rule per modelled construct from the STATIC-ANALYSIS.md section 1 table: \label
      -> LABEL_NUMBER/LABEL_PAGE value facts with CONTENT_VOLUME->LABEL_PAGE LAYOUT lag 0; \ref -> REF_USE
      with LABEL_NUMBER->REF_USE AUX_ROUNDTRIP lag 1; \pageref -> PAGEREF_USE AUX_ROUNDTRIP lag 1; sectioning
      -> TOC_ENTRY; \caption -> LOF/LOT; \cite -> CITE_USE->BBL TOOL lag 1; \bibliography -> BBL; \value
      in control -> COUNTER_READ. Opaque nodes mark the file''s facts unknown. Acceptance: lowering the
      bibliography-cascade example in docs/IR.md yields exactly the facts and edges in that table.'
    labels:
    - task
    - ir
  - title: Implement exists/value split and single CONTENT_VOLUME synthetic fact
    body: 'Split every list-producing fact into exists and value nodes. CONTENT_VOLUME is one synthetic
      fact per document with a mandatory span pointing at the first pagination- sensitive construct; CONTENT_VOLUME
      depends only on exists components (LIST_EXTENT via LAYOUT lag 1); LABEL_PAGE.value depends on CONTENT_VOLUME;
      PAGEREF_USE depends on LABEL_PAGE.value. Acceptance: the table-of-contents example in docs/IR.md
      lowers to an acyclic graph where TOC_ENTRY.exists has no CONTENT_VOLUME back-edge.'
    labels:
    - task
    - ir
  - title: ARG serialisation to JSON and Graphviz DOT with `auxflow graph`
    body: 'Serialise the ARG to JSON for tests and to Graphviz DOT for inspection. Wire the `auxflow graph`
      CLI subcommand to emit DOT, colouring nodes by component (exists/value) and edges by dependency_type
      so a benign cycle and an amplifying cycle are visually distinct. Acceptance: `auxflow graph` on
      a fixture produces parseable DOT; a round-trip test loads the JSON form back into an identical ARG.'
    labels:
    - task
    - ir
- phase: 8
  title: Phase 8 — SCC analysis
  hours: 6
  risk: LOW
  depends_on:
  - 7
  milestone: cp4
  labels:
  - phase
  - analysis
  body: 'Detect strongly connected components of the ARG using Tarjan''s algorithm implemented iteratively
    with an explicit stack (a recursive version exhausts the interpreter stack on the realistic corpus
    member), per docs/STATIC-ANALYSIS.md section 3. Output components in reverse topological order so
    stable-pass numbering needs no separate topological sort, and build the condensation for phase 10.
    Classify each non-trivial SCC (|C|>1, or |C|==1 with a self-loop): AMPLIFYING if any internal edge
    is STRUCTURAL, UNKNOWN_CYCLE if any fact is opaque, else BENIGN. O(V+E) time, O(V) space. This phase
    is testable on synthetic graphs with no LaTeX involved and should be built before taint. Both phases
    9 and 10 depend on it. Acceptance: iterative Tarjan returns the correct strongly connected components
    on synthetic graphs including a known multi-node cycle and a self-loop, with no recursion and the
    condensation emitted in reverse topological order.'
  sub_issues:
  - title: Iterative (non-recursive) Tarjan SCC over the ARG
    body: 'Implement Tarjan''s SCC algorithm with an explicit work stack and index/lowlink arrays; no
      recursion, so deep graphs do not overflow the interpreter stack. Produce components in reverse topological
      order. Acceptance: a synthetic graph test with a chain of 100000 nodes completes without RecursionError,
      and known-SCC fixtures return the exact expected component partition.'
    labels:
    - task
    - analysis
  - title: Build the condensation graph in topological order
    body: 'From the Tarjan output construct the condensation (DAG of components) with inter- component
      edges, available in reverse topological order for phase 10 consumption. Acceptance: synthetic graph
      with two cycles connected by a bridge yields a 2-plus-node condensation whose topological order
      places predecessor components first; unit test asserts no intra-component edges remain in the condensation.'
    labels:
    - task
    - analysis
  - title: Cycle classification into AMPLIFYING / UNKNOWN_CYCLE / BENIGN
    body: 'For each SCC with |C|>1 or a self-loop, label AMPLIFYING when any intra-component edge has
      dependency_type STRUCTURAL, else UNKNOWN_CYCLE when any member fact is opaque, else BENIGN. Acceptance:
      synthetic fixtures covering each branch — a STRUCTURAL-edged cycle labelled AMPLIFYING, an opaque-member
      cycle labelled UNKNOWN_CYCLE, and a pure AUX_ROUNDTRIP/LAYOUT cycle labelled BENIGN — all pass.'
    labels:
    - task
    - analysis
- phase: 9
  title: Phase 9 — Taint analysis
  hours: 8
  risk: MED
  depends_on:
  - 8
  milestone: cp4
  labels:
  - phase
  - analysis
  body: 'Content-quantity taint propagation per docs/STATIC-ANALYSIS.md section 2: a forward worklist
    reachability over value-carrying edges that inserts STRUCTURAL edges to CONTENT_VOLUME. STRUCTURAL
    is the load-bearing edge type and is never produced by lowering; it is added only here. Seeds are
    facts whose value is read in the condition/bound of a ControlConstruct, in a \setcounter bounding
    such a construct, or in a page-emitting construct (\newpage/\clearpage) under such control. Propagation
    is deliberately coarse (over- approximating, safe direction) and monotonic over the powerset lattice,
    so it terminates; each fact enters the worklist at most once, O(V+E) time O(V) space. The unsoundness
    lives in the seed rule, not the propagation. Depends only on phase 8. Acceptance: content-quantity
    taint inserts STRUCTURAL edges so b08''s amplifying cycle gains a STRUCTURAL edge while b05''s table-of-contents
    cycle does not.'
  sub_issues:
  - title: Seed set computation from control constructs
    body: 'Compute the seed set: facts whose value is read inside a ControlConstruct condition or bound,
      inside a \setcounter whose counter bounds such a construct, or inside a page- emitting construct
      (\newpage, \clearpage) under such control. Acceptance: on the amplifying-cycle example in docs/IR.md,
      PAGEREF_USE(l) is seeded; a backward-reference- only document seeds nothing (empty seed set test).'
    labels:
    - task
    - analysis
  - title: Forward worklist propagation over value-carrying edges
    body: 'Implement the monotonic worklist loop: pop a tainted fact, follow each out-edge to a destination
      with component == "value", add to taint and push if new. Acceptance: taint grows monotonically and
      each fact is pushed at most once (assert via a push counter); termination test on a cyclic value-edge
      graph does not loop forever.'
    labels:
    - task
    - analysis
  - title: STRUCTURAL edge insertion to CONTENT_VOLUME with reason strings
    body: 'For each tainted fact, add_edge(f -> CONTENT_VOLUME, pass_lag=1, dependency_type=STRUCTURAL,
      reason="value at <f.source_location> reaches a content- generating construct"). Acceptance: after
      taint on the amplifying example a STRUCTURAL edge PAGEREF_USE(l) -> CONTENT_VOLUME exists, closing
      a cycle through CONTENT_VOLUME -> LABEL_PAGE(l) -> PAGEREF_USE(l); the reason string embeds the
      fact span verbatim.'
    labels:
    - task
    - analysis
- phase: 10
  title: Phase 10 — Stable-pass fixpoint
  hours: 8
  risk: LOW
  depends_on:
  - 8
  milestone: cp5
  labels:
  - phase
  - analysis
  body: 'Compute per-fact stable_pass numbering on the condensation, per docs/STATIC-ANALYSIS.md section
    4, so cycles cannot cause non-termination. Visit components in topological order: AMPLIFYING/UNKNOWN_CYCLE
    members get stable_pass None (not bounded); a BENIGN cycle gets the heuristic base + |C| (base = 1
    + max bounded pred, default 0), flagged as heuristic / open decision D7 and never tuned to the corpus;
    a singleton gets 1 if no preds, None if any pred is unbounded, else 1 + max(stable_pass[g] + lag(g,f)
    - 1). Let P be the max bounded stable_pass (0 if none); derived predicted_runs = P + 1. Longest-path
    over a DAG, O(V+E) time O(V) space. Depends only on phase 8. Acceptance: per-fact stable_pass numbers
    are computed over the condensation and the derived run count equals P + 1 on a certified fixture.'
  sub_issues:
  - title: Singleton-component stable-pass recurrence
    body: 'For single-member components implement stable_pass: 1 when preds empty, None when any predecessor
      is unbounded, else 1 + max over preds of (stable_pass[g] + lag(g,f) - 1). Acceptance: the backward-reference
      example in docs/IR.md yields LABEL_NUMBER.value=1 and REF_USE=2; the table-of-contents example yields
      CONTENT_VOLUME=2 and LABEL_PAGE.value=2.'
    labels:
    - task
    - analysis
  - title: Condensation traversal with BENIGN-cycle heuristic and unbounded propagation
    body: 'Walk the condensation in topological order. Assign None to every member of AMPLIFYING or UNKNOWN_CYCLE
      components; assign base + |C| to BENIGN cycle members with base = 1 + max bounded predecessor stable_pass
      (default 0). The base+|C| value must be flagged in code as the open-decision-D7 heuristic. Acceptance:
      the amplifying-cycle example assigns None to all three facts; a synthetic BENIGN 2-cycle with a
      stable_pass-1 predecessor yields 4.'
    labels:
    - task
    - analysis
  - title: Derive P and predicted run count
    body: 'Compute P = max over bounded stable_pass values (default 0) and predicted_runs = P + 1. Acceptance:
      the backward-reference example derives predicted_runs 2, the table-of- contents example 3, and the
      bibliography-cascade example 4, matching the worked tables in docs/IR.md; a document with no facts
      derives predicted_runs 1.'
    labels:
    - task
    - analysis
- phase: 11
  title: Phase 11 — Classification and diagnostics
  hours: 10
  risk: MED
  depends_on:
  - 9
  - 10
  milestone: cp5
  labels:
  - phase
  - analysis
  body: 'Implement the four-state classifier that turns SCC analysis (phase 9 taint) and stable-pass numbering
    (phase 10) into one of CERTIFIED / BENIGN_CYCLIC / AMPLIFYING / UNKNOWN per NON-CONVERGENCE.md. Each
    state has an exact condition: CERTIFIED(N) requires an acyclic ARG with no opaque facts and bounded
    stable_pass, N = P + 1; BENIGN_CYCLIC when every cycle is benign and no opaque facts; AMPLIFYING(c)
    when an SCC contains a STRUCTURAL edge; UNKNOWN on any opaque fact or unmodelled package. Expose `auxflow
    classify` emitting the four diagnostic report formats verbatim. Reports must name which facts, where
    in source, what dependency kind, and likely cause, drawing on Fact.source_location, DepEdge.reason,
    DepEdge.dependency_type, SCC membership and stable_pass. Acceptance: b08 classified AMPLIFYING with
    all three facts and spans; b05 NOT classified amplifying. Never print "cannot converge"; only "may
    not converge".'
  sub_issues:
  - title: Implement the four-state classifier decision logic
    body: 'Add a classifier that consumes the condensation with SCC labels and per-fact stable_pass and
      returns CERTIFIED(N)/BENIGN_CYCLIC(N?)/AMPLIFYING(c)/UNKNOWN using the exact table conditions in
      NON-CONVERGENCE.md. CERTIFIED requires acyclic ARG, no opaque facts, bounded stable_pass, N = P
      + 1. AMPLIFYING triggers when any SCC contains a STRUCTURAL edge. UNKNOWN on any opaque fact or
      unmodelled package. Acceptance: unit tests cover each of the four states and the N = P + 1 bound.'
    labels:
    - task
    - analysis
  - title: Render the four NON-CONVERGENCE.md diagnostic formats
    body: 'Emit the amplifying-cycle, benign-cycle (higher verbosity only), unknown, and certified report
      blocks exactly as laid out in NON-CONVERGENCE.md, including the cycle fact list with spans, STRUCTURAL/LAYOUT/TOOL
      edge annotations, likely-cause line, and the certified longest-dependency-chain with per-fact stable_pass
      numbers. Wording must use "may not converge", never "cannot converge". Acceptance: golden tests
      compare rendered output byte-for-byte against the documented examples.'
    labels:
    - task
    - analysis
  - title: Wire the `auxflow classify` CLI subcommand
    body: 'Add `auxflow classify <entry.tex>` that runs the pipeline through phases 9 and 10, invokes
      the classifier, prints the selected diagnostic format, and exits non-zero only on amplifying-without-force
      per the documented behaviour. Benign cycles print only at higher verbosity. Acceptance: invoking
      `auxflow classify` on a fixture emits the correct state label and the matching report block.'
    labels:
    - task
    - cli
  - title: Add the b08/b05 classifier guard tests
    body: 'Two highest-value tests from NON-CONVERGENCE.md: b08 MUST classify AMPLIFYING with all three
      cycle facts named at correct spans (PAGEREF_USE, CONTENT_VOLUME, LABEL_PAGE); b05 (table of contents)
      MUST NOT classify amplifying and lands BENIGN_CYCLIC. Acceptance: both tests present, named, and
      passing; b05 is the negative guard against flagging every document with a TOC.'
    labels:
    - task
    - test
- phase: 12
  title: Phase 12 — Build planner
  hours: 10
  risk: MED
  depends_on:
  - 11
  milestone: cp6
  labels:
  - phase
  - planner
  body: 'Implement BuildPlan generation per BUILD-PLANNER.md: a serialisable JSON structure with classification,
    predicted_runs, steps (each with tool/args/jobname/reason/verify_after), max_runs, stop_condition,
    diagnostics, arg_stats and model_version. Apply the four ordered lowering/optimisation passes: dead-file
    elimination of auxiliary per-file tooling over unreachable files, dead-tool elimination of bibtex
    unless citation facts and a bibliography command both exist, optional index tool, and engine-run emission
    (predicted_runs when certified, else the conservative default). Set verify_after on the final engine
    step in every classification. Amplifying refuses with no steps unless --force. Enforce the safety
    invariant: the emitted plan is never shorter than the conservative default unless CERTIFIED. Expose
    `auxflow plan --explain` with a per-step reason traceable to a fact or classification. Acceptance:
    the safety-invariant property test passes, `auxflow plan --explain` prints a per-step reason traceable
    to a fact or classification, and an amplifying document refuses to plan without --force.'
  sub_issues:
  - title: Write the safety invariant assertion and its property test FIRST
    body: 'Before any other planner code, add the assertion that the emitted plan length is never shorter
      than the conservative default unless classification is CERTIFIED, and a property test over randomly
      generated classifications that exercises it. This is the guard that an analysis bug cannot silently
      corrupt a document. Acceptance: the property test fails if the invariant is removed and passes with
      it enforced.'
    labels:
    - task
    - test
  - title: Implement BuildPlan/Step dataclasses and JSON serialisation
    body: 'Add frozen Step (tool, args, jobname, reason, verify_after) and BuildPlan (classification,
      predicted_runs, steps, max_runs, stop_condition, diagnostics, arg_stats, model_version) exactly
      per BUILD-PLANNER.md and make BuildPlan serialise to JSON round-trip. reason is required on every
      step. Acceptance: serialising the documented certified example yields the shown JSON and deserialises
      back equal.'
    labels:
    - task
    - planner
  - title: Implement the four ordered lowering/optimisation passes
    body: 'Apply in order: (1) auxiliary per-file tooling only over inclusion-graph-reachable files (dead-file
      elimination); (2) bibtex iff citation facts exist AND a bibliography command is present, placed
      after the first engine run (dead-tool elimination); (3) index tool iff index facts exist; (4) engine
      runs = predicted_runs when certified else the conservative default; then set verify_after on the
      final engine step; amplifying emits no steps and exits non-zero unless --force. Acceptance: tests
      show bibtex omitted when no citations, spellcheck skipped for unreachable files, and an amplifying
      input yields empty steps with populated diagnostics and non-zero exit.'
    labels:
    - task
    - planner
  - title: Wire `auxflow plan --explain` CLI output
    body: 'Add `auxflow plan [--explain] [--force] <entry.tex>` that classifies, builds the BuildPlan,
      and with --explain prints each step with its reason traceable to a fact or the classification. Non-certified
      plans match the conservative default sequence; amplifying without --force refuses and emits the
      diagnosis. Acceptance: --explain on a certified fixture lists per-step reasons including "P=3 so
      runs=P+1".'
    labels:
    - task
    - cli
- phase: 13
  title: Phase 13 — Runtime verification
  hours: 12
  risk: MED
  depends_on:
  - 12
  milestone: cp6
  labels:
  - phase
  - executor
  body: 'Implement the plan executor and runtime verification per RUNTIME-VERIFICATION.md. The executor
    runs the BuildPlan steps, and after every engine run and every extension run normalises the auxiliary
    state into a set of canonical records (label, toc, lof, lot, bib), discarding ordering/whitespace/comments
    and the committed exclusion list, then compares consecutive normalised states by set equality to determine
    the aux_fixpoint. It must not trust engine rerun warnings, which are unsound. Implement the bounded
    extension policy: if planned runs complete but the normalised state is still changing, perform extra
    runs up to max_runs and record a prediction miss (document, predicted, observed), never suppressed.
    Honour the documented stop conditions (planned_count, aux_fixpoint, cap) and failure states (tool_error,
    missing_input, cap_exceeded, opaque_abort, amplifying_refused), surfacing engine logs unmodified.
    Expose `auxflow run`. Acceptance: `auxflow run` converges on every certified corpus member with zero
    undeclared under-predictions and the bounded extension policy stops at max_runs.'
  sub_issues:
  - title: Implement auxiliary-state normalisation into canonical record sets
    body: 'Parse each auxiliary file into the canonical records from RUNTIME-VERIFICATION.md: ("label",key,number,page),
      ("toc",level,title_text,page), ("lof",number,caption,page), ("lot",number,caption,page), ("bib",key,formatted_text).
      Discard ordering, whitespace, comments and entries on a small committed exclusion list with a written
      reason per entry; the result is a set compared by equality. Acceptance: reordered/whitespace- differing
      aux files normalise to equal sets; an excluded record kind is dropped.'
    labels:
    - task
    - executor
  - title: Implement the executor run loop with stop conditions
    body: 'Execute BuildPlan steps in sequence; after each engine run capture normalised state and compare
      to the previous to detect aux_fixpoint; terminate on planned_count, aux_fixpoint, or cap per the
      documented loop. Surface external tool logs unmodified and implement failure states tool_error,
      missing_input (abort before executing), cap_exceeded, opaque_abort (--strict + UNKNOWN), amplifying_refused.
      Acceptance: a fixture that stabilises early returns CONVERGED at k; a never-stabilising one hits
      cap and exits non-zero with the suspected-non-convergence report.'
    labels:
    - task
    - executor
  - title: Implement the bounded extension policy and prediction-miss logging
    body: 'When planned runs complete but the normalised state is still changing, perform additional runs
      up to max_runs and record a prediction miss with the document, predicted count and observed count.
      Prediction misses are logged, never suppressed, and are an evaluation metric for assumption A2.
      Acceptance: a document needing one extra run beyond predicted_runs records exactly one prediction
      miss with correct predicted/observed values.'
    labels:
    - task
    - executor
  - title: Wire the `auxflow run` CLI subcommand
    body: 'Add `auxflow run [--force] [--strict] <entry.tex>` that classifies, plans, and executes under
      the plan with normalised verification, returning the stop condition and any prediction miss, exiting
      non-zero on cap_exceeded / amplifying_refused / opaque_abort. Acceptance: `auxflow run` on a certified
      fixture completes with stop_condition planned_count and verify_after honoured on the final run.'
    labels:
    - task
    - cli
- phase: 14
  title: Phase 14 — Benchmark harness
  hours: 14
  risk: MED
  depends_on:
  - 13
  milestone: eval
  labels:
  - phase
  - benchmarks
  body: 'Author the fifteen-document benchmark corpus with hand-written expectations, the seven baselines
    (A, B, C, C'', C'''', D, E), the measurement harness, and ground-truth computation. Each corpus member
    exercises one non-convergence mechanism from RELATED-WORK.md section 7.3, including the four AuxFlow
    cannot detect (b11-b13 declared false negatives). expected.json is the oracle and is written before
    the analyser produces any output, so results are not circular. Ground truth N* is computed by normalised
    auxiliary-state equivalence plus rendered-text equality against a reference run count MAX=8. Acceptance:
    bench/ directory layout from BENCHMARKS.md exists; every document compiles under the pinned TeX Live
    image; baselines are readable shell scripts; harness emits one JSONL record per repetition.'
  sub_issues:
  - title: Author the fifteen-member corpus with hand-written expected.json oracle files
    body: 'Create bench/corpus/b01_plain .. b15_ibid, each with main.tex, expected.json and a one-paragraph
      README.md. One mechanism per document per BENCHMARKS.md design rule 1. Every non-convergence mechanism
      in RELATED-WORK.md 7.3 gets a member, including the four AuxFlow cannot detect. b11-b13 carry declared_false_negative:true
      with mechanism and why_undetected; b05 and others carry must_not:["AMPLIFYING"]. b09_thesis must
      contain unreachable auxiliary files. Expectations are hand-derived before implementation; never
      back-filled from program output. bench/corpus/shared/ holds refs.bib and auditthesis.cls. Acceptance:
      all 15 expected.json validate against the schema shown in BENCHMARKS.md and every main.tex compiles
      under a stock engine.'
    labels:
    - task
    - benchmarks
  - title: Implement baselines A, B, C, C', C'' as readable shell scripts
    body: 'Create bench/baselines/fixed.sh (A), warning.sh (B), checksum.sh (C consecutive-output), inputs.sh
      (C'' consecutive-input), readwrite.sh (C'''' same-run read-then-written), plus a README.md stating
      what each does and deliberately does not do. Each baseline oracle and its soundness direction must
      match the EVALUATION.md table: A costs 3+tools, B is unsound both directions, C costs N+1, C'' and
      C'''' cost N. Scripts share identical normalisation and differ only in the mechanism under study.
      Acceptance: each script is under ~10 readable lines of oracle logic and terminates with a documented
      certify/rerun verdict on b01-b08.'
    labels:
    - task
    - benchmarks
  - title: Implement harness run.py and normalise.py emitting JSONL per repetition
    body: 'bench/harness/run.py executes one (document, baseline) pair and emits one JSONL record per
      repetition including image digest, document id, baseline, repetition index, and every metric from
      EVALUATION.md. bench/harness/normalise.py maps auxiliary state to a canonical record set per RUNTIME-VERIFICATION.md
      so all baselines compare identically. Protocol: one container per repetition, SOURCE_DATE_EPOCH
      and FORCE_SOURCE_DATE set every run, cold primary with one discarded warm-up run. Acceptance: running
      run.py over b02_backref with baseline C produces well-formed JSONL whose fields parse and whose
      normalised state is stable across repetitions.'
    labels:
    - task
    - benchmarks
  - title: Implement ground-truth computation groundtruth.py (normalised-state equivalence)
    body: 'bench/harness/groundtruth.py computes N* as the smallest N<=MAX (MAX=8) such that the normalised
      auxiliary state A_N equals A_MAX and extracted text T_N equals T_MAX, else records divergent(MAX),
      per the adopted criterion in EVALUATION.md. PDF byte equality is computed only as a secondary column,
      never as ground truth. Acceptance: groundtruth.py returns N*=1 for b01_plain, a higher N* for b04_chain,
      and divergent(8) for b08_cycle, with the secondary PDF-byte column populated separately and the
      normalisation exclusion list (open decision D6) recorded in the output.'
    labels:
    - task
    - benchmarks
  - title: Record reference-implementation verdicts for the oracle cross-check
    body: 'Wire the harness to record, per corpus member, the verdicts and diagnostics of the real tools
      whose oracles baselines C/C''/C'''' re-implement: latexmk 4.88, latexrun, Tectonic, and hand-ported
      Typst for amplifying/oscillating members. Load labelschanged in the LaTeX baselines to capture its
      per-label report. These are a cross-check for RQ6, not baselines. Acceptance: each JSONL record
      for an externally-cross-checked document carries the real tool''s verdict alongside the in-repo
      baseline verdict so divergences are visible.'
    labels:
    - task
    - benchmarks
- phase: 15
  title: Phase 15 — Evaluation
  hours: 12
  risk: MED
  depends_on:
  - 14
  milestone: eval
  labels:
  - phase
  - evaluation
  body: 'Run the full measurement over the corpus and all baselines, then regenerate the mechanism-coverage
    table and the oracle-comparison table entirely from the JSONL results via report.py. No figure is
    produced by hand. At least ten repetitions per (document, baseline), reported per document as median,
    p95 and interquartile range; no corpus-wide mean. The mechanism-coverage table gives per mechanism
    the expected classification, the observed classification, and whether a mismatch was declared in advance.
    The oracle-comparison table gives per corpus member each oracle''s verdict, its soundness direction,
    and the executions it consumed. Acceptance: b08 observed AMPLIFYING, b05 not AMPLIFYING, b11-b13 misclassified
    as predicted; every number traces to a committed results file under bench/results/.'
  sub_issues:
  - title: Execute the full measurement run under the pinned, isolated protocol
    body: 'Run run.py over all 15 documents x 7 baselines with at least ten repetitions each, one container
      per repetition, CPU pinned, cold primary with a discarded warm-up, and SOURCE_DATE_EPOCH/FORCE_SOURCE_DATE
      set. Write raw JSONL under bench/results/ (regenerated, not committed) and promote the report set
      under bench/results/published/. Acceptance: a complete JSONL set exists with image digest recorded
      in every record and distributions (not point estimates) available for every timing metric.'
    labels:
    - task
    - evaluation
  - title: Implement report.py to regenerate the mechanism-coverage table from JSONL
    body: 'bench/harness/report.py reads JSONL and emits the mechanism-coverage table: per mechanism the
      expected classification, observed classification, and whether a mismatch was declared in advance
      (SCOPE.md item 15). Predicted misclassifications (b11-b13) are reported separately from genuine
      misses so a predicted and an unpredicted false negative are never averaged together. Acceptance:
      regenerating from JSONL yields b08 AMPLIFYING, b05 not AMPLIFYING, and b11-b13 shown as declared
      false negatives; re-running the generator reproduces the table byte-for-byte.'
    labels:
    - task
    - evaluation
  - title: Generate the oracle-comparison table from JSONL
    body: 'Extend report.py to emit the oracle-comparison table: per corpus member each oracle''s verdict,
      its soundness direction, and the executions it consumed to certify (A=3+tools, B=unsound both directions,
      C=N+1, C''=N, C''''=N, D=0, E=N+1 only on a prediction miss), per SCOPE.md item 16 and the EVALUATION.md
      baseline table. Report per document only, with median/p95/IQR; no corpus-wide mean. Acceptance:
      the table shows the C-vs-C''/C'''' extra-run gap and the B unsoundness gap in both directions, each
      cell traceable to a results file.'
    labels:
    - task
    - evaluation
  - title: Verify the two headline gates and the declared-false-negative gate hold
    body: 'Add a results-checking step asserting the three gates from BENCHMARKS.md: b08 classified AMPLIFYING
      with all three facts named and correct spans; b05 not AMPLIFYING; b11-b13 classified CERTIFIED (or
      b13 UNKNOWN per the package table) exactly as their expected.json predicted, flagged as declared
      false negatives rather than surprises. Any b11-b13 observed AMPLIFYING/UNKNOWN when CERTIFIED was
      predicted must be surfaced as a failure to investigate. Acceptance: the gate check passes on the
      published results and fails loudly if any gate regresses.'
    labels:
    - task
    - evaluation
- phase: 16
  title: Phase 16 — Documentation and report
  hours: 12
  risk: LOW
  depends_on:
  - 15
  milestone: eval
  labels:
  - phase
  - documentation
  body: 'Write the final report, regenerate all figures from the committed JSONL, and rehearse the demonstration.
    The report presents per-document results only, shows losses as prominently as wins (the realistic
    b09_thesis is expected to show no saving and appears in the same table and font), shows analysis overhead
    rather than absorbing it, and states that no performance improvement is promised. Every number traces
    to a committed script and a results file under bench/results/. Acceptance: the report builds from
    sources, all figures regenerate from JSONL via report.py, and a rehearsed end-to-end demonstration
    runs the pipeline on a corpus member.'
  sub_issues:
  - title: Write the evaluation report grounded in the published results
    body: 'Author the report presenting the mechanism-coverage and oracle-comparison tables, the three
      gates, and the threats to validity from EVALUATION.md (corpus size, single machine, synthetic non-convergence,
      assumption A2, author bias). Report per document only; no corpus-wide mean; losses shown in the
      same table as wins; analysis overhead shown, never netted out. State explicitly that no performance
      improvement is promised. Acceptance: the report contains no number that lacks a committed script
      and bench/results/ file backing it.'
    labels:
    - task
    - documentation
  - title: Regenerate all figures from JSONL via report.py
    body: 'Produce every figure in the report by running report.py over the published JSONL, so no figure
      is hand-drawn, matching the Reproducibility rule in README.md and BENCHMARKS.md. Figures use distributions
      (median/p95/IQR) for timing claims and include the secondary PDF-byte-equality column where it disagrees
      with N*. Acceptance: deleting and regenerating the figure directory reproduces identical figures
      from the committed JSONL alone.'
    labels:
    - task
    - documentation
  - title: Rehearse the end-to-end demonstration on a corpus member
    body: 'Script and rehearse a demonstration that runs the full pipeline on a corpus member: auxflow
      tokens/ast/check/graph/classify/plan --explain/run, then the harness and report.py, ending on b08_cycle
      showing the AMPLIFYING classification and the NON-CONVERGENCE.md report. The rehearsal confirms
      the pinned container image, deterministic timestamps, and that every displayed figure regenerates.
      Acceptance: the demonstration runs start-to-finish without manual fixups and reproduces the b08
      headline result and at least one declared false negative.'
    labels:
    - task
    - documentation
risk_register:
- risk: Parser scope creep toward real-world documents
  likelihood: HIGH
  impact: HIGH
  mitigation: Default-deny language subset; the fallback rule is implemented in phase 1, before the parser
    exists.
- risk: Recursive Tarjan overflowing the interpreter stack
  likelihood: MED
  impact: MED
  mitigation: Iterative Tarjan with an explicit stack from the start; the realistic corpus document is
    large enough to trigger recursion limits.
- risk: The ARG collapsing into a fixed lattice
  likelihood: MED
  impact: HIGH
  mitigation: Instance-level facts are specified in IR.md; fact and edge counts are asserted against hand
    counts in phase 7.
- risk: Benign-cycle bound mispredicting the run count
  likelihood: MED
  impact: MED
  mitigation: Open decision D7 carries a specified conservative fallback; prediction misses are reported,
    not hidden.
- risk: Ground-truth criterion chosen badly
  likelihood: MED
  impact: HIGH
  mitigation: Open decision D6 must close before any measurement; PDF byte equality is already rejected
    on evidence in favour of normalised auxiliary-state equivalence.
- risk: Evaluation squeezed into the last week
  likelihood: MED
  impact: HIGH
  mitigation: MVP complete at week 8 (day 4 here), leaving a two-week margin for evaluation and write-up.
- risk: Infrastructure work displacing compiler work
  likelihood: LOW
  impact: HIGH
  mitigation: Infrastructure is not in the repository at all; the cut order removes stretch items first
    and never the core.
- risk: Assumption A2 failing broadly
  likelihood: LOW
  impact: MED
  mitigation: Prediction misses are a reported metric at Gate 2, so the failure is measurable rather than
    invisible.
